<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="beigeFill" x1="20" y1="10" x2="100" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#E8DCC8"/>
    </linearGradient>
    <linearGradient id="goldAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4B896"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Outer seal ring -->
  <circle cx="60" cy="60" r="54" fill="url(#beigeFill)" stroke="#3D3428" stroke-width="1.25"/>
  <circle cx="60" cy="60" r="48" stroke="#B8A488" stroke-width="0.5" opacity="0.7"/>

  <!-- Courtyard walls — four L-shapes evoking a traditional Emirati house -->
  <g stroke="#3D3428" stroke-width="1.4" stroke-linecap="square" fill="none">
    <path d="M34 78 V52 H46"/>
    <path d="M86 78 V52 H74"/>
    <path d="M34 42 V68 H46"/>
    <path d="M86 42 V68 H74"/>
  </g>

  <!-- Wind-tower silhouette -->
  <g stroke="#3D3428" stroke-width="1.2" fill="none">
    <rect x="54" y="28" width="12" height="22" rx="0.5"/>
    <path d="M52 28 H68"/>
    <path d="M52 34 H68"/>
    <path d="M52 40 H68"/>
    <path d="M52 46 H68"/>
  </g>

  <!-- Living heart — central motif representing enduring heritage -->
  <circle cx="60" cy="66" r="9" stroke="url(#goldAccent)" stroke-width="1.3" fill="none"/>
  <circle cx="60" cy="66" r="3.5" fill="#8B6914"/>

  <!-- Subtle arabesque corner marks -->
  <g stroke="#C4A574" stroke-width="0.75" opacity="0.85">
    <path d="M24 60 H30 M60 24 V30 M96 60 H90 M60 96 V90"/>
  </g>
</svg>
